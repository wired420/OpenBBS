[workspace]
resolver = "2"
members = ["crates/openbbs", "crates/openbbs-core", "xtask"]
default-members = ["crates/openbbs", "crates/openbbs-core"]

[workspace.package]
# The patch number is bumped automatically by `cargo xtask build`.
# This is the version of the most recent release build.
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/wired420/OpenBBS"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6"
clap = { version = "4.6", features = ["derive"] }
rand = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
russh = { version = "0.63", default-features = false, features = ["flate2", "ring"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
